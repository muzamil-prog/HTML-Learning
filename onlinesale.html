<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahra Stores</title>
    <style>
         *{
            margin: 0;
            padding: 0;

         }
         header{
        background-color: rgb(4, 8, 17);
        height: 90px;
         }
         ul{
            display: flex;
            justify-content: left;
            align-items: center;
            text-decoration: none;
            padding-left: 20px;
            padding-bottom: 10px;
         }
         li{
            padding: 20px;
            text-decoration: none;
            list-style: none;
            color: white;
         }
         li a{
            color: white;
         }
         .searchbar{
            display: flex;
              justify-content: center;
              text-align: center;
              padding-left: 50px;
         }
         .discountbox li{
            display: flex;
         }
         body{
            background-color: white;
         }
    </style>
</head>
<body>
    <header>
 <nav>
     <ul>
    <li><img src="zahra_logo-.avif" alt="" width="70px"></li>
    <li><a href="#sale">Online Sale</a></li>
    <li><a href="#contect">Contect</a></li>
    <div class="searchbar">
    <input type="text" placeholder="Search here">
    </div>
    <button class="btn">Search</button>
  </ul>
 </nav>
    </header>
    <main>
        <div class="main"><img src="New banner.webp" alt="" width="100%"></div>
    </main>
    <div class="discountbox">
        <marquee  scrollamount="35px" behavior="" direction="">
        <img src="50percent_570x.webp" alt="" height="300px" width="400px">
        <img src="40percent_570x.webp" alt="" width="400px" height="300px">
        <img src="30percent_570x.webp" alt="" width="400px " height="300px
        ">
        </marquee>
    </div>
    
</body>
</html>
